<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline — OASIS ONE</title>
  <style>
    :root {
      --brand-navy: #1E1F33;
      --brand-gold: #F3D3A2;
      --brand-cream: #FCF6E3;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: var(--brand-navy);
      color: var(--brand-cream);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .container {
      max-width: 440px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }
    .mark-container {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      border: 1px solid rgba(243, 211, 162, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.04);
    }
    .mark-img {
      width: 52px;
      height: 52px;
      object-fit: contain;
    }
    .eyebrow {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--brand-gold);
    }
    h1 {
      font-size: 28px;
      font-weight: 300;
      letter-spacing: -0.02em;
      line-height: 1.2;
    }
    p {
      font-size: 14px;
      line-height: 1.6;
      color: rgba(252, 246, 227, 0.7);
    }
    .btn {
      display: inline-block;
      margin-top: 12px;
      padding: 12px 28px;
      border-radius: 12px;
      background: var(--brand-gold);
      color: var(--brand-navy);
      font-size: 13px;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      border: none;
      transition: opacity 0.15s ease;
    }
    .btn:hover {
      opacity: 0.9;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="mark-container">
      <img src="/brand/icon-192.png" alt="OASIS ONE" class="mark-img" />
    </div>
    <div class="eyebrow">ODISHA · STARTUP COMMUNITY</div>
    <h1>You're offline</h1>
    <p>Check your connection to return to the Odisha startup community.</p>
    <button class="btn" onclick="window.location.reload()">Try again</button>
  </div>
</body>
</html>
