<style>
@property --accent{syntax:'<color>';inherits:true;initial-value:#88DECC}
:root{color-scheme:dark;--bg:#03080B;--tx:#F5FAF6;--mut:rgba(236,241,239,.75);--ease:cubic-bezier(.2,.8,.2,1);--spring:cubic-bezier(.34,1.45,.5,1);

{n:'Aspiring Entrepreneur',s:'Aspiring Entrepreneur',sub:'I have an idea to explore',a:'#A78BFA',p:'85% 30%',i:['💡','🧭','✨'],t:['Ideation','Validation','Mentorship'],q:['The sector your idea sits in','The problem you want to solve','Your city']},
{n:'Mentor or Advisor',s:'Mentor',sub:'I guide and back founders',a:'#F3D3A2',p:'80% 30%',i:['🏆','🛡️','👥'],t:['Advisory','Angel Network','Dealflow'],q:['Company and job title','Years of experience','LinkedIn profile']}];
const box=document.getElementById('panels'),stage=document.getElementById('stage'),live=document.getElementById('live'),meta=document.getElementById('meta'),fills=[...document.querySelectorAll('.seg i')];
box.innerHTML=R.map((r,n)=>`<article class="panel" role="radio" aria-checked="false" aria-label="${r.n}" tabindex="0" style="--a:${r.a};--pos:${r.p}">
<i class="ring"></i>
<div class="ph base"></div><div class="ph col"></div><div class="shade"></div>
<div class="idle" aria-hidden="true"><h2>${r.n}</h2><p>${r.sub}</p><div class="tags">${r.t.map(x=>`<b>${x}</b>`).join('')}</div></div>
<div class="strip" aria-hidden="true"><span></span><h2>${r.s}</h2></div>
<div class="open"><h2>${r.n}</h2><p>${r.sub}</p><small>Next we’ll ask for</small><ul>${r.q.map(x=>`<li>${x}</li>`).join('')}</ul><button class="go" type="button">Continue as ${r.s}</button></div>
</article>`).join('');
const ps=[...box.children];let sel=-1,tm;
function step(s){fills.forEach((x,i)=>x.style.width=i<s-1?'100%':i===s-1?(s>1||sel>=0?'100%':'35%'):'0');meta.textContent=`Step ${s} of 4 · ${s*25}%`}
function pick(n,e){
  if(n===sel)return;sel=n;
  const p=ps[n],b=p.getBoundingClientRect();
  p.style.setProperty('--cx',e&&e.clientX?((e.clientX-b.left)/b.width*100)+'%':'50%');
  p.style.setProperty('--cy',e&&e.clientY?((e.clientY-b.top)/b.height*100)+'%':'45%');
  box.dataset.sel=n;stage.dataset.has=1;stage.style.setProperty('--accent',R[n].a);
  ps.forEach((x,j)=>{x.classList.toggle('on',j===n);x.classList.remove('ready');x.setAttribute('aria-checked',j===n);x.querySelector('.go').textContent='Continue as '+R[j].s});
  clearTimeout(tm);tm=setTimeout(()=>p.classList.add('ready'),800); /* button appears only after the layout settles */
  step(1);save();live.textContent='Selected: '+R[n].n;if(navigator.vibrate)navigator.vibrate(12);
}
ps.forEach((p,n)=>{
  p.addEventListener('click',e=>pick(n,e));
  p.addEventListener('keydown',e=>{
    if(e.target!==p)return;
    if(e.key==='Enter'||e.key===' '){e.preventDefault();pick(n)}
    const d={ArrowRight:1,ArrowDown:1,ArrowLeft:-1,ArrowUp:-1}[e.key];
    if(d){e.preventDefault();const m=(n+d+3)%3;ps[m].focus();pick(m)}
  });
  p.querySelector('.go').addEventListener('click',e=>{e.stopPropagation();go(2)});
});
step(1);

/* ---------- Steps 2–4 + submitted ---------- */
const K=['founder','aspiring','mentor'],vx=document.getElementById('vx'),v1=document.getElementById('v1');
const S={name:'',email:'',pw:'',g:0,d:{},fl:{},ck:[0,0,0]};let cur=1,nn=0;
try{S.d=JSON.parse(sessionStorage.oasis_reg_details||'{}');S.name=sessionStorage.oasis_reg_name||''}catch(e){}
const save=()=>{try{sessionStorage.oasis_reg_details=JSON.stringify(S.d);sessionStorage.oasis_reg_name=S.name;if(sel>=0)sessionStorage.oasis_reg_role=K[sel]}catch(e){}};
const D=()=>S.d[K[sel]]||(S.d[K[sel]]={}),fl=()=>S.fl[K[sel]]||(S.fl[K[sel]]=[]);
const esc=t=>String(t==null?'':t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const LI='LinkedIn profile';
const F={
founder:[{k:'startupName',l:'Startup name',req:1,ph:'Registered trade name or venture title'},{k:'founderRole',l:'Your role',t:'select',req:1,o:['Founder / CEO','Co-founder / CTO','COO','Founding Team']},{k:'stage',l:'Current stage',t:'chips',req:1,o:['Ideation','MVP / prototype ready','Early Revenue','Growth / Scaled']},{k:'isRegistered',l:'Company status',t:'toggle',o:['Registered','Early stage']},{k:'website',l:'Website or product demo',t:'url',req:1,ph:'https://'},{k:'linkedin',l:LI,t:'li',req:1,ph:'linkedin.com/in/yourname'},{k:'description',l:'Elevator pitch and current progress',t:'area',req:1,min:20},{k:'evidence',l:'Supporting proof',t:'file'}],
aspiring:[{k:'ideaDomain',l:'Primary sector',t:'select',req:1,o:['AI & Automation','AgriTech','CleanTech','HealthTech','D2C','Handloom & Culture','Other']},{k:'description',l:'The problem you want to solve and the support you need',t:'area',req:1,min:20},{k:'city',l:'City',req:1,ph:'Bhubaneswar, Cuttack, or where you are abroad',dl:'cities'},{k:'linkedin',l:LI,t:'li',w:1,ph:'linkedin.com/in/yourname'}],
mentor:[{k:'currentCompany',l:'Company or fund',req:1,ph:'e.g. Tata Consultancy Services'},{k:'jobTitle',l:'Job title',req:1,ph:'e.g. VP Engineering, Managing Partner'},{k:'yearsExperience',l:'Years of experience',t:'chips',req:1,o:['5–8 years','8–12 years','12–15 years','15+ years']},{k:'linkedin',l:LI,t:'li',w:1,req:1,ph:'linkedin.com/in/yourname'},{k:'description',l:'How you mentor and where you can help founders',t:'area',req:1,min:20},{k:'supportingEvidence',l:'Credentials for the Mentor Verified badge',t:'file'}]};
const T={founder:['Tell us about your startup','The committee checks that your venture exists and what traction it has.'],aspiring:['Tell us about your idea','No company or paperwork needed. Share the problem and where you are.'],mentor:['Tell us about your experience','We vet every mentor so founders can trust who they meet.']};
const LH=v=>/^Registered/.test(v)?'Pvt Ltd, LLP, MSME or DPIIT':'MVP or website proof';
const hint=()=>(K[sel]=='founder'?(/^Registered/.test(D().isRegistered)?'Certificate of Incorporation or DPIIT letter':'Pitch deck, MVP screenshots or website proof'):'Advisory agreement, angel portfolio or credentials')+' · PDF, PNG or JPG, 10 MB max';
const chip=()=>`<div class="chip"><i></i>${R[sel].n}<button type="button" class="ghost" data-a="role">Change</button></div>`;
const btns=(n,t)=>`<div class="btns"><button type="button" class="ghost" data-a="back">Back</button><button type="button" class="btn" data-a="${n}">${t}<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button></div>`;
const af=(k,l,t,ac)=>`<div class="f" data-f="${k}" style="--n:${nn++}"><label for="a_${k}">${l}</label><input id="a_${k}" data-k="${k}" data-s="a" type="${t}" value="${esc(S[k])}" autocomplete="${ac}"><div class="err"></div></div>`;
const flH=()=>fl().map((x,i)=>`<div class="file"><span>${esc(x.n)}</span><em>${x.s=='scan'?'Scanning…':x.s=='ok'?'✓ Verified':'✕ '+x.s}</em><button type="button" class="ghost" data-a="rm" data-i="${i}">Remove</button></div>`).join('');
const fh=f=>{const v=D()[f.k],a=`data-k="${f.k}" data-s="d"`,id='i_'+f.k;let c;
 if(f.t=='select')c=`<select ${a} id="${id}"><option value="">Select…</option>${f.o.map(o=>`<option${o==v?' selected':''}>${o}</option>`).join('')}</select>`;
 else if(f.t=='chips'||f.t=='toggle')c=`<div class="opts" ${a}>${f.o.map(o=>`<button type="button" class="opt${v==o?' on':''}" data-v="${o}">${o}</button>`).join('')}</div>`;
 else if(f.t=='area')c=`<textarea ${a} id="${id}">${esc(v)}</textarea>`;
 else if(f.t=='file')c=`<label class="drop"><input type="file" hidden multiple accept=".pdf,.png,.jpg,.jpeg" data-fk="1"><b>Drop files here or browse</b><span class="fh">${hint()}</span></label><div class="files" id="fl">${flH()}</div>`;
 else c=`<input ${a} id="${id}" type="${f.t=='url'?'url':'text'}"${f.dl?` list="${f.dl}"`:''} value="${esc(v)}" placeholder="${f.ph||''}" autocomplete="off">`;
 return `<div class="f${f.w||['chips','toggle','area','file'].includes(f.t)?' w':''}" data-f="${f.k}" style="--n:${nn++}"><label for="${id}">${f.l}${f.req||f.t=='toggle'||f.t=='chips'?'':' · optional'}${f.t=='area'?`<span class="lh"><span id="cn">${(v||'').length}</span> / 20 min</span>`:f.t=='toggle'?`<span class="lh" id="lh2">${LH(v)}</span>`:''}</label>${c}<div class="err"></div></div>`};
function V2(){return `<section class="sheet"><h2 class="st">Create your account</h2><p class="lead">Use Google for the fastest start, or sign up with email.</p>
<button type="button" class="g" data-a="google"><b>G</b>Continue with Google</button><div class="or">or with email</div>
<div class="fg">${af('name','Full name','text','name')}${af('email','Email','email','email')}
${S.g?`<p class="lead w">Signed in with Google. No password needed. <button type="button" class="ghost" data-a="nog">Use a password instead</button></p>`:`<div class="f w" data-f="pw" style="--n:4"><label for="a_pw">Password<button type="button" class="ghost" data-a="eye" style="float:right;padding:0">Show</button></label><input id="a_pw" data-k="pw" data-s="a" type="password" autocomplete="new-password"><div class="meter"><i></i><i></i><i></i><i></i></div><div class="err"></div></div>`}</div>
${btns('next','Continue')}</section>`}
function V3(){const k=K[sel],d=D();if(k=='founder'&&!d.isRegistered)d.isRegistered=F.founder[3].o[1];
return `<section class="sheet"><h2 class="st">${T[k][0]}</h2><p class="lead">${T[k][1]}</p><div class="fg">${F[k].map(fh).join('')}</div><datalist id="cities">${['Bhubaneswar','Cuttack','Rourkela','Berhampur','Sambalpur','Puri','Balasore','Outside Odisha (diaspora)'].map(c=>`<option value="${c}">`).join('')}</datalist>${btns('next','Review application')}</section>`}
const H=()=>{const d=D(),k=K[sel];return k=='founder'?`${d.founderRole||'Founder'} @ ${d.startupName||'Your startup'}`:k=='mentor'?`${d.jobTitle||'Mentor'} @ ${d.currentCompany||'Your organisation'}`:`Aspiring entrepreneur${d.ideaDomain?' · '+d.ideaDomain:''}`};
const HL={2:{founder:'Your venture, in front of the right people.',aspiring:'Every company starts with an idea like yours.',mentor:'Your experience, where it matters most.'},3:{founder:'Show us what you’re building.',aspiring:'Tell us where your idea starts.',mentor:'Show us the experience founders will lean on.'}};
const hero=s=>`<aside class="hero" style="--img:var(--ph${sel+1});--pos:${R[sel].p}"><div class="hp"></div><div class="hc">${chip()}<h2>${s==4?'Almost there.':HL[s][K[sel]]}</h2>${s==2?`<div class="tags">${R[sel].t.map(x=>`<b>${x}</b>`).join('')}</div>`:`<div class="pc"><div class="av">${esc((S.name||R[sel].s)[0].toUpperCase())}</div><div><b id="hn"></b><span id="hh"></span></div></div><div class="bar"><i id="hb"></i></div><small id="ht"></small>`}</div></aside>`;
function heroLive(){const g=q=>vx.querySelector(q);if(!g('#hh'))return;const d=D(),fs=F[K[sel]].filter(f=>f.req&&f.t!='file'),ok=fs.filter(f=>d[f.k]&&!chk(f,d[f.k])).length;g('#hn').textContent=S.name||'Your name';g('#hh').textContent=H();g('#hb').style.width=ok/fs.length*100+'%';g('#ht').textContent=`${ok} of ${fs.length} required answers`}
function V4(){const d=D(),row=(a,b)=>`<dt>${a}</dt><dd>${esc(b)||'—'}</dd>`;
return `<section class="sheet"><h2 class="st">Review your application</h2><p class="lead">The admissions committee reads exactly what you see here.</p>
<div class="rv"><div class="rh"><b>Account</b><button type="button" class="ghost" data-a="e2">Edit</button></div><dl>${row('Name',S.name)+row('Email',S.email)+row('Sign-in',S.g?'Google':'Email and password')}</dl></div>
<div class="rv"><div class="rh"><b>${R[sel].s} details</b><button type="button" class="ghost" data-a="e3">Edit</button></div><dl>${F[K[sel]].map(f=>row(f.l,f.t=='file'?fl().filter(x=>x.s=='ok').map(x=>x.n).join(', '):d[f.k])).join('')}</dl></div>
${['I confirm everything above is accurate and I am authorised to submit it.','I agree to the Terms of Service and Privacy Policy.','I understand the committee reviews every application before I get access.'].map((t,i)=>`<label class="ck"><input type="checkbox" data-c="${i}"${S.ck[i]?' checked':''}>${t}</label>`).join('')}
<div class="btns"><button type="button" class="ghost" data-a="back">Back</button><button type="button" class="btn" data-a="submit"${S.ck.every(Boolean)?'':' disabled'}>Submit to committee</button></div></section>`}
const V5=ref=>`<section class="sheet ok"><svg viewBox="0 0 80 80"><circle cx="40" cy="40" r="36"/><path d="M24 41l11 11 21-23"/></svg><h2 class="st">Application submitted</h2><p class="lead">We’ll email ${esc(S.email)} once the committee has decided.</p><span class="pill"><i></i>Pending review · ${ref}</span>
<ul class="tl"><li class="d">Application received</li><li class="n">Committee review</li><li>Access to the community</li></ul></section>`;
function go(s){cur=s;v1.hidden=s!==1;nn=0;stage.classList.toggle('fit',s>1);vx.innerHTML=s>1?`<div class="split">${hero(s)}${[0,0,V2,V3,V4][s]()}</div>`:'';step(s);if(s==2)meter();if(s>2)heroLive();scrollTo({top:0,behavior:'smooth'})}
const meter=()=>{const p=S.pw||'',n=(p.length>=8)+(/[a-z]/.test(p)&&/[A-Z]/.test(p))+/\d/.test(p)+/[^\w\s]/.test(p);vx.querySelectorAll('.meter i').forEach((x,i)=>x.style.background=i<n?'var(--accent)':'')};
const chk=(f,v)=>{v=(v||'').trim();if(!v)return f.req?'Required':'';if(f.t=='email'&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v))return 'Enter a valid email address';if(f.t=='url'&&!/^https?:\/\/[^\s.]+\.\S+/i.test(v))return 'Enter a full link starting with https://';if(f.t=='li'&&!/^(https?:\/\/)?([\w-]+\.)?linkedin\.com\/in\/[\w%-]+\/?$/i.test(v))return 'Use your profile link, like linkedin.com/in/yourname';if(f.min&&v.length<f.min)return `Add at least ${f.min} characters (${v.length} so far)`;return ''};
function val(fs,get){let first;fs.filter(f=>f.t!='file'&&f.t!='toggle').forEach(f=>{const el=vx.querySelector(`[data-f="${f.k}"]`);if(!el)return;const m=chk(f,get(f.k));el.classList.remove('bad');void el.offsetWidth;el.querySelector('.err').textContent=m;if(m){el.classList.add('bad');first=first||el}});if(first)first.scrollIntoView({block:'center',behavior:'smooth'});return !first}
function next(){if(cur==2){if(val([{k:'name',req:1,min:2},{k:'email',t:'email',req:1},{k:'pw',req:1,min:8}],k=>S[k]))go(3)}else if(cur==3){if(val(F[K[sel]],k=>D()[k]))go(4)}}
function addFiles(list){for(const f of list){const ok=['application/pdf','image/png','image/jpeg'].includes(f.type),x={n:f.name,s:!ok?'Only PDF, PNG or JPG':f.size>1e7?'Over 10 MB':'scan'};fl().push(x);/* real build: POST /api/v1/uploads, server runs antivirus + MIME scan */if(x.s=='scan')setTimeout(()=>{x.s='ok';up()},1100)}up()}
const up=()=>{const e=vx.querySelector('#fl');if(e)e.innerHTML=flH()};
const submitApplication=async p=>{console.log('POST /api/v1/auth/register',p);/* await fetch('/api/v1/auth/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(p)}) */await new Promise(r=>setTimeout(r,1300));return{ref:'OAS-'+Math.random().toString(36).slice(2,8).toUpperCase()}};
async function submit(){const b=vx.querySelector('[data-a=submit]'),d=D();b.disabled=true;b.textContent='Submitting…';
 const payload={authProvider:S.g?'google':'password',name:S.name,email:S.email,password:S.g?undefined:S.pw,role:K[sel],roleData:d,profile:{name:S.name,city:d.city,bio:d.description,role:K[sel],headline:H()},evidence:fl().filter(x=>x.s=='ok').map(x=>x.n)};
 try{const r=await submitApplication(payload);['oasis_reg_role','oasis_reg_details','oasis_reg_name'].forEach(k=>sessionStorage.removeItem(k));vx.innerHTML=V5(r.ref);step(4);meta.textContent='Submitted · 100%';scrollTo({top:0,behavior:'smooth'})}catch(e){b.disabled=false;b.textContent='Try again'}}
vx.addEventListener('input',e=>{const t=e.target,k=t.dataset.k;if(!k)return;(t.dataset.s=='a'?S:D())[k]=t.value;save();t.closest('.f').classList.remove('bad');if(k=='pw')meter();heroLive();if(t.tagName=='TEXTAREA')vx.querySelector('#cn').textContent=t.value.length});
vx.addEventListener('change',e=>{const t=e.target;if(t.dataset.fk){addFiles(t.files);t.value=''}if(t.dataset.c){S.ck[+t.dataset.c]=t.checked;vx.querySelector('[data-a=submit]').disabled=!S.ck.every(Boolean)}});
vx.addEventListener('dragover',e=>{const d=e.target.closest('.drop');if(d){e.preventDefault();d.classList.add('over')}});
vx.addEventListener('dragleave',e=>{const d=e.target.closest('.drop');if(d)d.classList.remove('over')});
vx.addEventListener('drop',e=>{const d=e.target.closest('.drop');if(d){e.preventDefault();d.classList.remove('over');addFiles(e.dataTransfer.files)}});
vx.addEventListener('click',e=>{const b=e.target.closest('[data-a],.opt');if(!b)return;
 if(b.classList.contains('opt')){const g=b.parentNode;g.querySelectorAll('.opt').forEach(o=>o.classList.toggle('on',o===b));D()[g.dataset.k]=b.dataset.v;save();g.closest('.f').classList.remove('bad');if(g.dataset.k=='isRegistered'){vx.querySelector('.fh').textContent=hint();vx.querySelector('#lh2').textContent=LH(b.dataset.v)}heroLive();return}
 ({back:()=>go(cur-1),role:()=>go(1),e2:()=>go(2),e3:()=>go(3),next,submit,google:()=>{S.g=1;S.name=S.name||'Demo User';S.email=S.email||'demo.user@gmail.com';save();go(2)},nog:()=>{S.g=0;go(2)},rm:()=>{fl().splice(+b.dataset.i,1);up()},eye:()=>{const i=vx.querySelector('#a_pw');i.type=i.type=='password'?'text':'password';b.textContent=i.type=='password'?'Show':'Hide'}})[b.dataset.a]();});
try{const r0=K.indexOf(sessionStorage.oasis_reg_role);if(r0>=0)pick(r0)}catch(e){}
</script>
