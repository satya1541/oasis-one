services:
  mysql:
    image: mysql:8.0
    container_name: oasis_mysql_local
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: Oasis
      MYSQL_USER: oasis_user
      MYSQL_PASSWORD: oasis_password
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_0900_ai_ci --default-time-zone='+00:00'

volumes:
  mysql_data:
